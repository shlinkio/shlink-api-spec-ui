version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: saturday
      time: '09:00'
      timezone: 'Europe/Madrid'
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      swagger:
        patterns:
          - 'swagger-ui-dist'
          - '@types/swagger-ui-dist'
      vite:
        patterns:
          - 'vite'
          - '@vitejs/*'
      coding-style:
        patterns:
          - '@shlinkio/eslint-config-js-coding-standard'
          - 'oxfmt'
          - 'oxlint'
          - 'oxlint-tsgolint'
      tailwindcss:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
      day: saturday
      time: '09:00'
      timezone: 'Europe/Madrid'
